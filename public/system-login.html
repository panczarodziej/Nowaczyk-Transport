<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowaczyk Transport — Logowanie</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef1f5;font-family:Segoe UI,Arial;color:#182c42}.card{width:min(440px,94vw);background:white;padding:36px;border-radius:19px;box-shadow:0 18px 55px #15233420;border-top:5px solid #208ded}h1{font-size:30px;margin:0}h1 span{color:#208ded}p{color:#6c7e91}label{display:block;font-weight:600;margin-top:18px}input{display:block;width:100%;padding:14px;border:1px solid #cad4df;border-radius:9px;margin-top:8px;font-size:16px}button{margin-top:20px;background:#208ded;color:white;border:0;border-radius:9px;padding:14px;width:100%;font-weight:bold;cursor:pointer}a{color:#167bd0}#msg{color:#bc2739}</style><style id="nowaczyk-brand-white">.brand,.brand b,.brand span,.logo,.logo em,aside h2,aside h2 span,.card>h1,.card>h1 span,.box>h1,.box>h1 span{color:#fff!important}.brand,.logo,aside h2{letter-spacing:.3px}.tag{color:#d1d8e2!important}</style></head><body><main class="card"><h1>Nowaczyk <span>Transport</span></h1><p>Centrum operacyjne — logowanie użytkownika</p><form id="f"><label>Login<input id="username" autocomplete="username" required></label><label>Hasło<input id="password" type="password" autocomplete="current-password" required></label><button>Zaloguj się</button><p id="msg" role="status"></p></form><p><a href="/rekrutacja.html">Przejdź do rekrutacji</a></p></main><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Logowanie…';try{let r=await fetch('/api/accounts/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});if(!r.ok){msg.textContent=(await r.json()).error||'Błąd logowania';return}const data=await r.json();sessionStorage.setItem('ksgroup-web-session',JSON.stringify({id:data.user.id,login:data.user.username,role:data.user.role}));location.href=data.user.role==='admin'?'/system.html':data.user.role==='dispatcher'?'/spedytor.html':(data.user.role==='driver'||data.user.role==='probation')?'/moj-panel.html':'/stanowisko.html'}catch{msg.textContent='Brak połączenia z serwerem'}};</script></body></html>
