<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowaczyk Transport — Logowanie</title><style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f1f4f7;font:16px "Segoe UI",Arial,sans-serif;color:#182c42}
.card{width:min(440px,100%);background:#fff;border:1px solid #d1dfee;border-radius:12px;overflow:hidden}
.card h1{margin:0;padding:22px 28px;background:#223242;color:#fff;font-size:24px}
.content{padding:24px 28px 28px}
.content>p{color:#52687f;margin:0 0 20px}
label{display:block;font-weight:600;margin-bottom:16px}
input{display:block;width:100%;padding:12px;border:1px solid #bdcde0;border-radius:7px;margin-top:7px;font:inherit;color:inherit}
button{background:#205f9d;color:#fff;border:0;border-radius:7px;padding:12px;width:100%;font:inherit;font-weight:600;cursor:pointer}
a{color:#12568c;text-decoration:none}
#msg{color:#a12233;margin:12px 0 0}
#msg:empty{display:none}
.content>p:last-child{margin:18px 0 0}
</style></head><body><main class="card"><h1>Nowaczyk Transport</h1><div class="content"><p>Zaloguj się do centrum operacyjnego.</p><form id="f"><label>Login<input id="username" autocomplete="username" required></label><label>Hasło<input id="password" type="password" autocomplete="current-password" required></label><button>Zaloguj się</button><p id="msg" role="status"></p></form><p><a href="/rekrutacja.html">Przejdź do rekrutacji</a></p></div></main><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Logowanie…';try{let r=await fetch('/api/accounts/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});if(!r.ok){msg.textContent=(await r.json()).error||'Błąd logowania';return}location.replace('/')}catch{msg.textContent='Brak połączenia z serwerem'}};window.addEventListener('pageshow',async event=>{
 if(!event.persisted)return;
 try{
  const response=await fetch('/api/accounts/me',{cache:'no-store'});
  const {user}=await response.json();
  if(user&&['admin','boss','dispatcher','driver','probation','subcontractor'].includes(user.role))location.replace('/');
 }catch{}
});
</script></body></html>
