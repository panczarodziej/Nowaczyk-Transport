<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowaczyk Transport — Logowanie</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#eef1f5;color:#263443;display:grid;place-items:center;min-height:100vh;padding:20px}.box{width:min(430px,100%);background:white;border-radius:20px;padding:34px;box-shadow:0 15px 55px #1523341b}h1{margin:0;font-size:30px}h1 span{color:#1689e9}.muted{color:#758293;font-size:14px;line-height:1.5}label{display:block;font-size:13px;margin:18px 0 6px;font-weight:650}input{width:100%;padding:13px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#1689e9;color:white;font-weight:700;margin-top:20px;cursor:pointer}a{color:#1689e9}#error{color:#c0392b;font-size:13px;min-height:18px}@keyframes ksEnter{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes ksSpin{to{transform:rotate(360deg)}}@keyframes ksGlow{50%{box-shadow:0 0 38px #1689e945}}.box{animation:ksEnter .65s cubic-bezier(.2,.8,.2,1) both;position:relative;overflow:hidden}.box:before{content:'';position:absolute;left:0;top:0;width:100%;height:5px;background:linear-gradient(90deg,#152334,#1689e9,#80d2ff)}input:focus{outline:2px solid #1689e9;outline-offset:1px;transition:.2s}button{transition:transform .2s,box-shadow .2s}button:hover{transform:translateY(-2px);box-shadow:0 8px 25px #1689e945}button:disabled{opacity:.8;cursor:wait}.loading button{animation:ksGlow 1s ease infinite}.loading button:after{content:'';display:inline-block;width:12px;height:12px;margin-left:10px;border:2px solid #fff8;border-top-color:white;border-radius:50%;animation:ksSpin .7s linear infinite;vertical-align:middle}@media(prefers-reduced-motion:reduce){.box,.loading button,.loading button:after{animation:none!important}button{transition:none}} </style><style>.nav{font-variant-ligatures:none;letter-spacing:.1px}.ks-digital-buttons button{font-family:inherit}</style><style id="nowaczyk-brand-white">.brand,.brand b,.brand span,.logo,.logo em,aside h2,aside h2 span,.card>h1,.card>h1 span,.box>h1,.box>h1 span{color:#fff!important}.brand,.logo,aside h2{letter-spacing:.3px}.tag{color:#d1d8e2!important}</style></head><body><div class="box"><h1>Nowaczyk <span>Transport</span></h1><p class="muted">Logowanie do systemu transportowego</p><form id="login"><label>Login</label><input id="user" autocomplete="username" required><label>Hasło</label><input id="password" type="password" autocomplete="current-password" required><button>Zaloguj się</button><p id="error"></p></form><p class="muted">Nie masz konta? <a href="rekrutacja.html">Złóż podanie</a></p><p class="muted">Demo: pierwsze wejście administratora: <b>admin / KSdemo2026!</b>. Zmień to przed jakąkolwiek prezentacją. Nie używaj prawdziwych haseł — dane są przechowywane lokalnie.</p></div><script>function ksLoginSuccess(url){const form=document.getElementById('login');form.classList.add('loading');const b=form.querySelector('button');b.disabled=true;b.firstChild.textContent='Logowanie…';setTimeout(()=>{location.href=url},550)}
document.getElementById('login').onsubmit=e=>{e.preventDefault();let u=document.getElementById('user').value.trim(),p=document.getElementById('password').value;let data={};try{data=JSON.parse(localStorage.getItem('ksgroup-data')||'{}')}catch{};let a=(data.accounts||[]).find(x=>x.login===u&&x.password===p);if(u==='admin'&&p==='KSdemo2026!'){sessionStorage.setItem('ksgroup-web-session',JSON.stringify({id:'local-admin'}));ksLoginSuccess('index.html');return}if(!a){document.getElementById('error').textContent='Nieprawidłowy login lub hasło.';return}let role=a.role||'driver';sessionStorage.setItem('ksgroup-web-session',JSON.stringify({id:a.id}));if(['driver','trial'].includes(role)){sessionStorage.setItem('ksgroup-driver-session',a.id);ksLoginSuccess('driver.html')}else if(role==='mechanic'||role==='subcontractor')ksLoginSuccess('pracownik.html');else ksLoginSuccess('index.html')};</script></body></html>
