<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowaczyk Transport — Panel pracownika</title><style>body{margin:0;background:#f2f5f8;font-family:Segoe UI,Arial;color:#263443}header{background:#30343b;color:white;padding:22px 32px;font-size:22px;font-weight:800}main{max-width:980px;margin:35px auto;padding:20px}.card{background:white;border:1px solid #dce2e9;border-radius:14px;padding:22px;margin-bottom:18px}button{border:0;background:#1689e9;color:white;border-radius:9px;padding:11px 16px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #e5e9ed}small{color:#718095}</style><style>.nav{font-variant-ligatures:none;letter-spacing:.1px}.ks-digital-buttons button{font-family:inherit}</style><style id="nowaczyk-brand-white">.brand,.brand b,.brand span,.logo,.logo em,aside h2,aside h2 span,.card>h1,.card>h1 span,.box>h1,.box>h1 span{color:#fff!important}.brand,.logo,aside h2{letter-spacing:.3px}.tag{color:#d1d8e2!important}</style></head><body><header>Nowaczyk Transport · Panel pracownika</header><main id="main"></main><script>let s=JSON.parse(sessionStorage.getItem('ksgroup-web-session')||'null'),d=JSON.parse(localStorage.getItem('ksgroup-data')||'{}'),a=(d.accounts||[]).find(x=>x.id===s?.id);if(!a||!['mechanic','subcontractor'].includes(a.role)){location.replace('login.html')}else{let n=(d.drivers||[]).find(x=>x.id===a.driver)?.name||a.login;document.getElementById('main').innerHTML='<div class="card"><h2>Witaj, '+n.replace(/[<>]/g,'')+'</h2><p>Stanowisko: <b>'+(JSON.parse(localStorage.getItem('ksgroup-custom-roles-v29')||'[]').find(r=>r.id===a.customRoleId)?.label||(a.role==='mechanic'?'Mechanik':'Podwykonawca'))+'</b></p><small>Widok demonstracyjny. Dane floty nie są pobierane z ETS2.</small></div>'+(a.role==='mechanic'?'<div class="card"><h3>Pojazdy do obsługi</h3><table><tr><th>Rejestracja</th><th>Model</th><th>Status</th></tr>'+(d.vehicles||[]).map(v=>'<tr><td>'+String(v.plate||'').replace(/[<>]/g,'')+'</td><td>'+String(v.model||'').replace(/[<>]/g,'')+'</td><td>'+String(v.status||'').replace(/[<>]/g,'')+'</td></tr>').join('')+'</table></div>':'<div class="card"><h3>Współpraca</h3><p>Własne zlecenia podwykonawcy będą dostępne po podłączeniu serwera i przypisywaniu firm do zleceń.</p></div>')+'<button id="logout">Wyloguj</button>';document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('ksgroup-web-session');location.href='login.html'}}
if(a?.role==='subcontractor'&&a.companyId){const company=(d.subs||[]).find(c=>c.id===a.companyId);if(company){const main=document.getElementById('main');const settingsKey='ksgroup-company-settings-v46';const settings=()=>{try{return JSON.parse(localStorage.getItem(settingsKey)||'{}')}catch{return {}}};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const box=document.createElement('div');box.className='card';box.innerHTML=`<h3>Profil firmy: ${esc(company.name)}</h3><p>Dodaj zdjęcie profilowe lub logo widoczne na stronie rekrutacji.</p><div id="logoPreview"></div><input id="companyLogo" type="file" accept="image/png,image/jpeg,image/webp"><button id="removeCompanyLogo" type="button">Usuń logo</button><p id="logoMsg"><small>PNG/JPG/WEBP, maks. 2 MB. Dane zapisują się lokalnie w tej przeglądarce.</small></p>`;main.insertBefore(box,main.querySelector('#logout'));const preview=()=>{const logo=settings()[company.id]?.logo;document.getElementById('logoPreview').innerHTML=logo?`<img src="${logo}" alt="Logo firmy" style="max-width:180px;max-height:110px;object-fit:contain;margin:10px 0">`:'<p>Brak zdjęcia profilowego</p>'};preview();document.getElementById('companyLogo').onchange=e=>{const file=e.target.files[0];e.target.value='';ksOpenLogoEditor(file,logo=>{const all=settings();all[company.id]={...(all[company.id]||{}),logo};try{localStorage.setItem(settingsKey,JSON.stringify(all));preview();document.getElementById('logoMsg').textContent='Zapisano zdjęcie firmy.'}catch{alert('Brak miejsca na zapis zdjęcia.')}})};document.getElementById('removeCompanyLogo').onclick=()=>{const all=settings();if(all[company.id])delete all[company.id].logo;localStorage.setItem(settingsKey,JSON.stringify(all));preview()}}}

function ksBasesForm(){if(!a||a.role!=='subcontractor')return;const id=a.companyId;const firm=(d.subs||[]).find(x=>x.id===id);if(!firm){document.getElementById('main').insertAdjacentHTML('beforeend','<div class="card">Administrator musi najpierw przypisać Twoje konto do firmy podwykonawczej.</div>');return}const key='ksgroup-company-settings-v46';let settings={};try{settings=JSON.parse(localStorage.getItem(key)||'{}')}catch{}const x=settings[id]||{};const bases=Array.isArray(x.bases)?x.bases:(x.city?[x.city]:[]);const card=document.createElement('div');card.className='card';card.innerHTML='<h3>Bazy firmy: '+String(firm.name).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</h3><p>Dodawaj lub zmieniaj miejscowości baz. Oddziel je przecinkami albo nowymi wierszami.</p><form id="baseForm"><textarea id="basesInput" rows="3" maxlength="1200" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5df;border-radius:9px">'+bases.map(v=>String(v).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))).join(', ')+'</textarea><p><button type="submit">Zapisz miejscowości</button></p><small id="baseMsg"></small></form>';document.getElementById('main').insertBefore(card,document.getElementById('logout'));document.getElementById('baseForm').onsubmit=e=>{e.preventDefault();const list=[...new Set(document.getElementById('basesInput').value.split(/[,;\n]+/).map(x=>x.trim().slice(0,80)).filter(Boolean))].slice(0,15);if(!list.length)return alert('Podaj co najmniej jedną miejscowość.');let v={};try{v=JSON.parse(localStorage.getItem(key)||'{}')}catch{}v[id]={...(v[id]||{}),city:list[0],bases:list};try{localStorage.setItem(key,JSON.stringify(v));document.getElementById('baseMsg').textContent='Zapisano. Miejscowości są widoczne w rekrutacji w tej przeglądarce.'}catch{alert('Nie udało się zapisać danych.')}}}
ksBasesForm();

// v4.11 — kadrowanie logo: przesuwanie i powiększenie przed zapisem.
function ksOpenLogoEditor(file,save){
 if(!file)return;
 if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>2*1024*1024){alert('Wybierz PNG/JPG/WEBP do 2 MB.');return}
 const reader=new FileReader();
 reader.onload=()=>{
  const img=new Image();
  img.onload=()=>{
   const old=document.getElementById('ksLogoEditor');if(old)old.remove();
   const wrap=document.createElement('div');wrap.id='ksLogoEditor';
   wrap.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.82);z-index:999999;display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box';
   wrap.innerHTML='<div style="background:white;color:#172033;width:min(95vw,470px);max-height:95vh;overflow:auto;border-radius:16px;padding:20px;box-sizing:border-box"><h2 style="margin:0 0 8px">Dopasuj zdjęcie firmy</h2><p>Przesuń zdjęcie myszką lub palcem, a suwakiem ustaw przybliżenie.</p><canvas id="ksCropCanvas" width="440" height="220" style="width:100%;aspect-ratio:2/1;display:block;touch-action:none;cursor:grab;border-radius:10px;border:1px solid #cbd5e1"></canvas><label style="display:block;margin:14px 0">Przybliżenie <input id="ksCropZoom" type="range" min="1" max="4" step=".01" value="1" style="width:100%"></label><div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" id="ksCropSave">Zapisz zdjęcie</button><button type="button" id="ksCropCancel">Anuluj</button></div></div>';
   document.body.appendChild(wrap);
   const cv=wrap.querySelector('canvas'),ctx=cv.getContext('2d'),zoom=wrap.querySelector('#ksCropZoom');
   let scale=Math.max(cv.width/img.width,cv.height/img.height),dx=0,dy=0,drag=null;
   function clamp(){const w=img.width*scale*Number(zoom.value),h=img.height*scale*Number(zoom.value);dx=Math.max((cv.width-w)/2,Math.min((w-cv.width)/2,dx));dy=Math.max((cv.height-h)/2,Math.min((h-cv.height)/2,dy))}
   function draw(){clamp();const w=img.width*scale*Number(zoom.value),h=img.height*scale*Number(zoom.value);ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(img,(cv.width-w)/2+dx,(cv.height-h)/2+dy,w,h)}
   zoom.oninput=draw;
   cv.onpointerdown=e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)};
   cv.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;const r=cv.getBoundingClientRect();dx+=(e.clientX-drag.x)*cv.width/r.width;dy+=(e.clientY-drag.y)*cv.height/r.height;drag.x=e.clientX;drag.y=e.clientY;draw()};
   cv.onpointerup=cv.onpointercancel=()=>drag=null;
   wrap.querySelector('#ksCropCancel').onclick=()=>wrap.remove();
   wrap.querySelector('#ksCropSave').onclick=()=>{draw();try{save(cv.toDataURL('image/webp',.8));wrap.remove()}catch(e){alert('Nie udało się zapisać zdjęcia.')}};
   draw();
  };
  img.onerror=()=>alert('Nie udało się odczytać zdjęcia.');
  img.src=reader.result;
 };
 reader.readAsDataURL(file);
}
</script></body></html>
