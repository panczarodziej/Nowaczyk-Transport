<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowaczyk Transport — Panel rekrutacji online</title><style>body{font:15px Segoe UI,Arial;background:#f3f6f9;margin:0;color:#17283a}main{max-width:1100px;margin:35px auto;padding:0 20px}.box{background:white;padding:22px;border-radius:13px;margin:16px 0;border:1px solid #d9e2ed}input,select,button{font:inherit;padding:9px;margin:5px;border-radius:7px;border:1px solid #b7c5d3}button{background:#2462a5;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;background:white}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}#panel{display:none}.muted{color:#607287}</style><main><h1>Nowaczyk Transport — rekrutacja online</h1><p><a id="operations" href="/system.html">← Centrum operacyjne</a> <a href="/firma.html">Moja firma</a> <a id="companyMap" href="/centrum-floty.html" hidden>Mapa moich kierowców</a> <button id="logout">Wyloguj</button></p><p id="error" role="status"></p><div id="panel"><div class="box"><h2>Podania kierowców</h2><div id="applications"></div></div></div></main><script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let companies=[];
async function api(url,method='GET',data){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Błąd');return j}
async function load(){try{
const {user}=await api('/api/accounts/me');
const recruiter=user?.role==='subcontractor'||(user?.role==='boss'&&user.companyId!=='nowaczyk');
companies=await api('/api/admin/companies');
if(recruiter){
 document.getElementById('operations').hidden=true;
 document.getElementById('companyMap').hidden=false;
 const apps=await api('/api/admin/applications');
 document.getElementById('panel').style.display='block';
 const list=document.getElementById('applications');
 list.replaceChildren();
 if(!apps.length)list.textContent='Brak podań do Twojej firmy.';
 for(const a of apps){
  const row=document.createElement('p');
  row.textContent=[a.fullname,a.discord,a.status,a.reason].filter(Boolean).join(' · ');
  if(a.status==='Nowe'){
   const button=document.createElement('button');
   button.textContent='Przyjmij';
   button.onclick=async()=>{
    button.disabled=true;
    try{await api('/api/admin/applications','PATCH',{id:a.id,status:'Przyjęte'});await load()}
    catch(error){document.getElementById('error').textContent=error.message;button.disabled=false}
   };
   row.append(button);
  }
  list.append(row);
 }
 return;
}
const apps=await api('/api/admin/applications');document.getElementById('panel').style.display='block';
 document.getElementById('applications').innerHTML=apps.length?`<div style="overflow:auto"><table><tr><th>Kandydat</th><th>Discord</th><th>Godziny</th><th>Firma</th><th>Status</th><th>Akcje</th></tr>${apps.map(a=>`<tr><td>${esc(a.fullname)}<br><small>${esc(a.reason)}</small></td><td>${esc(a.discord)}</td><td>${esc(a.hours)}</td><td><select data-company="${esc(a.id)}">${companies.map(c=>`<option value="${esc(c.id)}" ${c.id===a.companyId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></td><td>${esc(a.status)}</td><td><button data-status="Przyjęte" data-id="${esc(a.id)}">Przyjmij</button><button data-status="Odrzucone" data-id="${esc(a.id)}">Odrzuć</button></td></tr>`).join('')}</table></div>`:'<p class="muted">Brak kierowców — nie ma jeszcze podań.</p>';document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{await api('/api/admin/applications','PATCH',{id:b.dataset.id,status:b.dataset.status,companyId:document.querySelector('[data-company="'+b.dataset.id+'"]').value});load()});document.querySelectorAll('[data-company]').forEach(b=>b.onchange=async()=>{await api('/api/admin/applications','PATCH',{id:b.dataset.company,companyId:b.value});load()})}catch(e){document.getElementById('error').textContent=e.message}}
document.getElementById('logout').onclick=async()=>{await api('/api/logout','POST');location.href='/system-login.html'};
load();
</script></html>
