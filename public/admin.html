<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowaczyk Transport — Panel rekrutacji online</title><style>body{font:15px Segoe UI,Arial;background:#f3f6f9;margin:0;color:#17283a}main{max-width:1100px;margin:35px auto;padding:0 20px}.box{background:white;padding:22px;border-radius:13px;margin:16px 0;border:1px solid #d9e2ed}input,select,button{font:inherit;padding:9px;margin:5px;border-radius:7px;border:1px solid #b7c5d3}button{background:#2462a5;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;background:white}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}#panel{display:none}.muted{color:#607287}</style><main><h1>Nowaczyk Transport — rekrutacja online</h1><p><a id="operations" href="/system.html">← Centrum operacyjne</a> <a id="companyMap" href="/centrum-floty.html" hidden>Mapa moich kierowców</a> <button id="logout">Wyloguj</button></p><p id="error" role="status"></p><div id="panel"><div class="box" id="companySettings" hidden><h2>Firmy i rekrutacja</h2><div id="firms"></div><h3>Dodaj podwykonawcę</h3><input id="name" placeholder="Nazwa firmy"><input id="city" placeholder="Miasto bazy"><input id="companyCode" maxlength="80" placeholder="Identyfikator firmy (opcjonalny)"><button id="add">Dodaj firmę</button></div><div class="box"><h2>Podania kierowców</h2><div id="applications"></div></div></div></main><script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let companies=[];
async function api(url,method='GET',data){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Błąd');return j}
async function load(){try{
const {user}=await api('/api/accounts/me');
const recruiter=user?.role==='subcontractor'||(user?.role==='boss'&&user.companyId!=='nowaczyk');
if(recruiter){
 document.getElementById('operations').hidden=true;
 document.getElementById('companyMap').hidden=false;
 const apps=await api('/api/admin/applications');
 document.getElementById('panel').style.display='block';
 const list=document.getElementById('applications');
 list.replaceChildren();
 if(!apps.length)list.textContent='Brak podań do Twojej firmy.';
 for(const a of apps){
  const row=document.createElement('p');
  row.textContent=[a.fullname,a.discord,a.status,a.reason].filter(Boolean).join(' · ');
  if(a.status==='Nowe'){
   const button=document.createElement('button');
   button.textContent='Przyjmij';
   button.onclick=async()=>{
    button.disabled=true;
    try{await api('/api/admin/applications','PATCH',{id:a.id,status:'Przyjęte'});await load()}
    catch(error){document.getElementById('error').textContent=error.message;button.disabled=false}
   };
   row.append(button);
  }
  list.append(row);
 }
 return;
}
document.getElementById('companySettings').hidden=false;
companies=await api('/api/admin/companies');const apps=await api('/api/admin/applications');document.getElementById('panel').style.display='block';document.getElementById('firms').innerHTML=companies.map(c=>`<div style="margin:12px 0;border-bottom:1px solid #ddd;padding:10px"><strong>${esc(c.name)}</strong> — ${esc((c.bases||[]).join(', '))} <button data-toggle="${esc(c.id)}">${c.open?'Zamknij rekrutację':'Otwórz rekrutację'}</button><div><label>Bazy (oddziel przecinkami) <input style="width:45%" id="base-${esc(c.id)}" value="${esc((c.bases||[]).join(', '))}"></label><button data-base="${esc(c.id)}">Zapisz bazy</button></div><div><label>Logo firmy <input type="file" accept="image/png,image/jpeg,image/webp" data-logo="${esc(c.id)}"></label></div></div>`).join('');document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const c=companies.find(x=>x.id===b.dataset.toggle);await api('/api/admin/companies','PATCH',{id:c.id,open:!c.open});load()});document.querySelectorAll('[data-base]').forEach(b=>b.onclick=async()=>{await api('/api/admin/companies','PATCH',{id:b.dataset.base,bases:document.getElementById('base-'+b.dataset.base).value.split(',').map(x=>x.trim()).filter(Boolean)});load()});document.querySelectorAll('[data-logo]').forEach(i=>i.onchange=()=>{const f=i.files[0];if(!f||f.size>85000){alert('Zdjęcie do 85 KB (zmniejsz przed dodaniem).');return}const rd=new FileReader();rd.onload=async()=>{try{await api('/api/admin/companies','PATCH',{id:i.dataset.logo,logo:rd.result});load()}catch(e){alert(e.message)}};rd.readAsDataURL(f)});
 document.getElementById('applications').innerHTML=apps.length?`<div style="overflow:auto"><table><tr><th>Kandydat</th><th>Discord</th><th>Godziny</th><th>Firma</th><th>Status</th><th>Akcje</th></tr>${apps.map(a=>`<tr><td>${esc(a.fullname)}<br><small>${esc(a.reason)}</small></td><td>${esc(a.discord)}</td><td>${esc(a.hours)}</td><td><select data-company="${esc(a.id)}">${companies.map(c=>`<option value="${esc(c.id)}" ${c.id===a.companyId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></td><td>${esc(a.status)}</td><td><button data-status="Przyjęte" data-id="${esc(a.id)}">Przyjmij</button><button data-status="Odrzucone" data-id="${esc(a.id)}">Odrzuć</button></td></tr>`).join('')}</table></div>`:'<p class="muted">Brak kierowców — nie ma jeszcze podań.</p>';document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{await api('/api/admin/applications','PATCH',{id:b.dataset.id,status:b.dataset.status,companyId:document.querySelector('[data-company="'+b.dataset.id+'"]').value});load()});document.querySelectorAll('[data-company]').forEach(b=>b.onchange=async()=>{await api('/api/admin/applications','PATCH',{id:b.dataset.company,companyId:b.value});load()})}catch(e){document.getElementById('error').textContent=e.message}}
document.getElementById('logout').onclick=async()=>{await api('/api/logout','POST');location.href='/system-login.html'};
document.getElementById('add').onclick=async()=>{try{await api('/api/admin/companies','POST',{name:document.getElementById('name').value,city:document.getElementById('city').value,id:document.getElementById('companyCode').value});load()}catch(e){alert(e.message)}};load();
</script></html>
