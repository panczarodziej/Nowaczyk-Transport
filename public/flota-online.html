<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowaczyk Transport — Flota online</title>
<style>body{font:15px Segoe UI,Arial,sans-serif;background:#edf2f7;color:#193047;margin:0}header{background:#2b323c;color:white;padding:18px 4%}main{max-width:1050px;margin:30px auto;padding:0 16px}.panel{background:white;padding:24px;border-radius:14px;margin:18px 0;box-shadow:0 2px 18px #172c4212}h1{margin:0 0 10px}label{display:block;margin:12px 0;font-weight:600}input,select{display:block;box-sizing:border-box;width:100%;max-width:520px;margin-top:6px;padding:12px;border:1px solid #c6d5e5;border-radius:8px}button{background:#1689ef;color:white;padding:12px 18px;border:0;border-radius:8px;cursor:pointer}a{color:#1585eb}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:12px;border-bottom:1px solid #e3e9f0}small{color:#61738b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}#message{font-weight:600;color:#b03b40}</style>
<header><h1>Nowaczyk <span style="color:#2794ff">Transport</span> — Flota online</h1><a style="color:white" href="/system.html">← Centrum operacyjne</a></header><main><div class="panel"><h2>Przypisz ciągnik i naczepę do konta kierowcy</h2><p>Możesz przypisać pojazd do dowolnego aktywnego konta.</p><form id="assign"><input id="vehicleId" type="hidden"><div class="grid"><label>Model ciągnika<input id="model" placeholder="Scania R450" required maxlength="100"></label><label>Rejestracja ciągnika<input id="plate" placeholder="KWA 1234A" required maxlength="30"></label><label>Model naczepy<input id="trailerModel" placeholder="Schmitz SKO 24" maxlength="100"></label><label>Rejestracja naczepy<input id="trailerPlate" placeholder="KWA 52341" maxlength="30"></label><label>Konto pracownika<select id="driverAccountId"><option value="">Nieprzypisany</option></select></label></div><button type="submit">Zapisz przypisanie</button><button type="button" id="clear" style="background:#67798d">Nowy pojazd</button></form><p id="message" role="status"></p></div><div class="panel"><h2>Pojazdy i przypisani kierowcy</h2><div style="overflow:auto"><table><thead><tr><th>Ciągnik</th><th>Naczepa</th><th>Kierowca</th><th>Akcja</th></tr></thead><tbody id="vehicles"></tbody></table></div></div><dialog id="saleDialog"><form id="saleForm">
<h2>Sprzedaj ciągnik</h2><p id="saleVehicle"></p>
<label>Cena sprzedaży (PLN)<input id="salePrice" type="number" required min="0.01" max="999999999.99" step="0.01"></label>
<p id="saleError" role="status"></p>
<button type="submit">Potwierdź sprzedaż</button>
<button type="button" id="cancelSale">Anuluj</button>
</form></dialog></main>
<script>
const $=id=>document.getElementById(id);let fleet=[];async function api(url,opts){const r=await fetch(url,opts),d=await r.json();if(!r.ok)throw Error(d.error||'Błąd serwera');return d}
async function refresh(){try{const data=await api('/api/fleet');fleet=data.fleet;const selected=$('driverAccountId').value;$('driverAccountId').replaceChildren(new Option('Nieprzypisany',''));for(const a of data.drivers)$('driverAccountId').add(new Option(a.username+' ('+a.role+')',a.id));$('driverAccountId').value=selected;const tbody=$('vehicles');tbody.replaceChildren();for(const v of fleet){const tr=document.createElement('tr');for(const val of [v.model+' — '+v.plate,(v.trailerModel||'—')+' '+(v.trailerPlate||''),v.driverUsername||'Nieprzypisany']){const td=document.createElement('td');td.textContent=val;tr.append(td)}const td=document.createElement('td'),btn=document.createElement('button');btn.textContent='Edytuj';btn.onclick=()=>{for(const k of ['model','plate','trailerModel','trailerPlate','driverAccountId'])$(k).value=v[k]||'';$('vehicleId').value=v.id;window.scrollTo(0,0)};const sell=document.createElement('button');
sell.type='button';
sell.textContent='Sprzedaj';
sell.onclick=()=>{
 saleId=v.id;
 $('saleVehicle').textContent=v.model+' · '+v.plate;
 $('saleError').textContent='';
 $('saleForm').reset();
 $('saleDialog').showModal();
};
td.append(btn,' ',sell);tr.append(td);tbody.append(tr)}if(!fleet.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.textContent='Brak pojazdów online — dodaj pierwszy.';tr.append(td);tbody.append(tr)}}catch(e){$('message').textContent=e.message}}
let saleId;
$('cancelSale').onclick=()=>$('saleDialog').close();
$('saleForm').onsubmit=async event=>{
 event.preventDefault();
 const button=event.submitter,id=saleId;
 button.disabled=true;
 $('saleError').textContent='';
 try{
  await api('/api/fleet/sell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,amount:$('salePrice').value})});
  $('saleDialog').close();
  if($('vehicleId').value===id)$('clear').click();
  $('message').style.color='#168348';
  $('message').textContent='Ciągnik sprzedany. Kwota trafiła do finansów firmy.';
  await refresh();
 }catch(error){$('saleError').textContent=error.message}
 finally{button.disabled=false}
};
$('assign').onsubmit=async e=>{e.preventDefault();const data={id:$('vehicleId').value,...Object.fromEntries(['model','plate','trailerModel','trailerPlate','driverAccountId'].map(k=>[k,$(k).value]))};try{await api('/api/fleet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});$('message').style.color='#168348';$('message').textContent='Przypisanie zapisane na serwerze.';$('assign').reset();$('vehicleId').value='';await refresh()}catch(err){$('message').style.color='#b03b40';$('message').textContent=err.message}};$('clear').onclick=()=>{$('assign').reset();$('vehicleId').value=''};refresh();
</script></html>
