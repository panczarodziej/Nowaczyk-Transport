<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowaczyk Transport — Rekrutacja</title><style>body{font:16px Segoe UI,Arial;background:#f2f5f9;color:#17283a;margin:0}header{background:#162b43;color:white;padding:23px max(20px,calc((100vw - 1000px)/2))}main{max-width:1000px;margin:35px auto;padding:0 20px}h1{text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card,form{background:white;border:1px solid #d9e1e9;border-radius:14px;padding:24px;box-shadow:0 3px 12px #132c4510}.card{text-align:center}.card img{width:100%;height:100px;object-fit:contain}button,a.button{background:#2563a8;color:white;border:0;border-radius:8px;padding:11px 17px;cursor:pointer;display:inline-block;text-decoration:none}button:disabled{background:#a7b3bf;cursor:not-allowed}.ok{color:#168453}.no{color:#b13e3e}label{display:block;margin:12px 0;font-weight:600}input,textarea,select{box-sizing:border-box;display:block;width:100%;padding:11px;border:1px solid #bfcbd8;border-radius:8px;margin-top:5px;font:inherit}form{max-width:620px;margin:25px auto}#formBox{display:none}.links{text-align:center;margin:28px}</style><header><h2>Nowaczyk Transport <small>— Transport krajowy i międzynarodowy</small></h2></header><main><h1>Wybierz firmę, do której aplikujesz</h1><div id="companies" class="grid"></div><section id="formBox"><form id="apply"><h2 id="companyTitle"></h2><input type="hidden" name="companyId" id="companyId"><label>Imię i nazwisko / pseudonim<input name="fullname" required minlength="2" maxlength="80"></label><label>Wiek<input type="number" name="age" min="13" max="99" required></label><label>Discord<input name="discord" required minlength="2"></label><label>Godziny w ETS2<input type="number" name="hours" min="0" required></label><label>Dyspozycyjność<input name="availability"></label><label>Preferowany ciągnik<input name="truck"></label><label>Dlaczego chcesz dołączyć?<textarea name="reason"></textarea></label><button>Wyślij podanie</button><p id="msg" role="status"></p></form></section><div class="links"><a href="/admin.html">Panel rekrutacji</a></div></main><script>
let companies=[];const el=document.getElementById('companies');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/companies');if(!r.ok)throw Error();companies=await r.json();el.innerHTML=companies.map(c=>`<div class="card">${c.logo?`<img src="${c.logo}" alt="Logo">`:''}<h2>${esc(c.name)}</h2><p>${esc((c.bases||[]).join(' • '))}</p><p class="${c.open?'ok':'no'}">${c.open?'● Rekrutacja otwarta':'● Rekrutacja zamknięta'}</p><button ${c.open?'':'disabled'} data-id="${esc(c.id)}">${c.open?'Złóż podanie':'Brak naboru'}</button></div>`).join('');el.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{const c=companies.find(x=>x.id===b.dataset.id);if(!c?.open)return;document.getElementById('companyId').value=c.id;document.getElementById('companyTitle').textContent='Podanie do '+c.name;document.getElementById('formBox').style.display='block';document.getElementById('formBox').scrollIntoView({behavior:'smooth'})})}catch{el.textContent='Nie udało się pobrać listy firm.'}}
document.getElementById('apply').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg'),data=Object.fromEntries(new FormData(e.target));msg.textContent='Wysyłanie…';try{const r=await fetch('/api/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error);msg.textContent='Podanie zostało wysłane do Nowaczyk Transport!';e.target.reset();document.getElementById('formBox').style.display='none';alert('Podanie wysłane!')}catch(err){msg.textContent='Błąd: '+err.message}};load();
</script></html>
