<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowaczyk Transport — Naczepy</title><style>body{font:16px system-ui;background:#101724;color:#edf2fa;max-width:950px;margin:35px auto;padding:16px}a{color:#9ac9ff}.panel{background:#1b2638;padding:20px;border-radius:12px;margin:18px 0}input,select,button{background:#0d1625;border:1px solid #50627b;border-radius:7px;color:white;padding:10px;margin:5px;max-width:100%}button{cursor:pointer;background:#2764a4}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #344257;text-align:left}small{color:#b6c4d5}</style><style id="nowaczyk-brand-white">.brand,.brand b,.brand span,.logo,.logo em,aside h2,aside h2 span,.card>h1,.card>h1 span,.box>h1,.box>h1 span{color:#fff!important}.brand,.logo,aside h2{letter-spacing:.3px}.tag{color:#d1d8e2!important}</style></head><body><a href="/index.html">← Nowaczyk Transport</a><h1>Rejestr naczep</h1><p>Możesz przypisać kilka naczep do tego samego aktywnego konta. Każda naczepa musi mieć własną rejestrację.</p><div id="msg"></div><section class="panel" id="edit" hidden><h2>Dodaj lub edytuj naczepę</h2><form id="form"><input type="hidden" name="id"><input name="plate" placeholder="Rejestracja" required maxlength="30"><input name="model" placeholder="Model naczepy" required maxlength="100"><select name="type"><option value="firanka">Firanka</option><option value="chlodnia">Chłodnia</option><option value="platforma">Platforma</option><option value="kontener">Kontener</option><option value="inna">Inna</option></select><select name="ownerCompanyId" id="company"></select><select name="assigneeId" id="assignee"><option value="">Bez przydziału</option></select><button>Zapisz naczepę</button><button type="button" id="clear">Nowa naczepa</button></form></section><section class="panel"><h2>Naczepy</h2><div style="overflow:auto"><table><thead><tr><th>Rejestracja</th><th>Model</th><th>Typ</th><th>Przypisano</th><th></th></tr></thead><tbody id="list"></tbody></table></div></section><script>
let trailers=[],admin=false;const msg=document.getElementById('msg');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(url,opts){const r=await fetch(url,{credentials:'same-origin',...opts});const v=await r.json();if(!r.ok)throw Error(v.error||'Błąd serwera');return v}
async function load(){try{const me=await json('/api/accounts/me');if(!me.user)throw Error('Zaloguj się do Nowaczyk Transport');admin=(me.user.role==='admin'||(me.user.role==='boss'&&me.user.companyId==='nowaczyk'));document.getElementById('edit').hidden=!admin;const d=await json('/api/trailers');trailers=d.trailers;const tbody=document.getElementById('list');tbody.innerHTML=trailers.map(t=>`<tr><td>${esc(t.plate)}</td><td>${esc(t.model)}</td><td>${esc(t.type)}</td><td>${esc(t.assigneeUsername||'—')} ${esc(t.assigneeRole==='subcontractor'?'(podwykonawca)':'')}</td><td>${admin?`<button data-id="${esc(t.id)}">Edytuj</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5">Brak naczep</td></tr>';tbody.querySelectorAll('button').forEach(b=>b.onclick=()=>edit(b.dataset.id));if(admin){document.getElementById('assignee').innerHTML='<option value="">Bez przydziału</option>'+d.assignees.map(a=>`<option value="${esc(a.id)}">${esc(a.username)} (${esc(a.role)})</option>`).join('');const companies=await json('/api/companies');document.getElementById('company').innerHTML=companies.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}}catch(e){msg.textContent=e.message}}
function edit(id){const t=trailers.find(x=>x.id===id);if(!t)return;const f=document.getElementById('form');for(const k of ['id','plate','model','type','ownerCompanyId','assigneeId'])f.elements[k].value=t[k]||'';document.getElementById('edit').scrollIntoView({behavior:'smooth'})}
function clearTrailerForm(){const form=document.getElementById('form');form.reset();form.elements.id.value=''}
document.getElementById('clear').onclick=clearTrailerForm;document.getElementById('form').onsubmit=async e=>{e.preventDefault();const a=Object.fromEntries(new FormData(e.target));try{await json('/api/trailers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(a)});msg.textContent='Zapisano naczepę';clearTrailerForm();await load()}catch(err){msg.textContent=err.message}};load();
</script></body></html>
