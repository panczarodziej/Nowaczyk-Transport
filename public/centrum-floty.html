<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowaczyk Transport — Centrum floty</title><style>body{margin:0;background:#0d1421;color:#f1f5fa;font:16px system-ui}main{max-width:1150px;margin:auto;padding:30px}h1{margin-bottom:4px}.muted{color:#a7b4c8}.panel{background:#182438;border:1px solid #344158;border-radius:16px;padding:20px;margin:18px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #354158}a{color:#8ac4ff}.status{font-weight:700}button{padding:10px;border:0;border-radius:7px;cursor:pointer}small{color:#a7b4c8}</style><main><a href="/">← Panel Nowaczyk Transport</a><h1>Centrum floty</h1><p class="muted">Pozycje i statusy kierowców z telemetrii ETS2.</p><div class="panel"><h2>Pozycje pojazdów</h2><p id="state" class="muted">Ładowanie…</p>
<div style="overflow:auto"><table><thead><tr><th>Kierowca</th><th>Status</th><th>Pozycja</th><th>Ładunek</th><th>Prędkość</th><th>Trasa</th><th>Ostatnia dostawa</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function driverState(p){
 if(!p.online)return 'Offline';
 if(p.activity==='Gra wstrzymana')return 'Aktywny · gra wstrzymana';
 return p.speedKmh>=3?'Aktywny · jedzie':'Aktywny · stoi';
}
function locationLabel(p){
 const city=[p.city,p.country].filter(Boolean).join(', ');
 const coordinates=Number.isFinite(p.x)&&Number.isFinite(p.z)&&(p.x!==0||p.z!==0)?'X '+Math.round(p.x)+' / Z '+Math.round(p.z):'';
 const location=city||coordinates;
 return location?(p.online?location:'Ostatnia: '+location):'Brak pozycji';
}
async function refresh(){
 try{
  const response=await fetch('/api/fleet/positions',{cache:'no-store'});
  if(!response.ok)throw Error(response.status===403?'Brak dostępu do Centrum floty.':'Nie udało się pobrać statusów.');
  const {positions}=await response.json();
  $('state').textContent=positions.length?'Aktywni: '+positions.filter(p=>p.online).length+' / '+positions.length:'Brak kierowców do wyświetlenia.';
  $('rows').innerHTML=positions.map(p=>{
   const route=p.dispatchRoute?[p.dispatchRoute.from,p.dispatchRoute.to].join(' → '):'—';
   const delivery=p.lastDelivery?[p.lastDelivery.city,p.lastDelivery.company].filter(Boolean).join(' · '):'Brak danych';
   const cargo=p.online&&p.cargo?p.cargo+(p.cargoMassKg?' · '+(p.cargoMassKg/1000).toLocaleString('pl-PL')+' t':''):'—';
   const speed=p.online&&p.activity!=='Gra wstrzymana'&&p.speedKmh>=3?p.speedKmh+' km/h':'—';
   return '<tr>'+[p.driver,driverState(p),locationLabel(p),cargo,speed,route,delivery].map(value=>'<td>'+esc(value)+'</td>').join('')+'</tr>';
  }).join('');
 }catch(error){$('rows').replaceChildren();$('state').textContent=error.message}
}
refresh();
setInterval(refresh,15000);
</script></html>
