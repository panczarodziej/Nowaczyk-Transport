<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finanse floty · Nowaczyk Transport</title><style>body{font:16px system-ui;background:#101724;color:#eaf0f8;max-width:1100px;margin:30px auto;padding:20px}a{color:#8ac9ff}section{background:#1c2939;border:1px solid #344458;border-radius:12px;padding:20px;margin:18px 0}input,select,button{background:#293b50;color:white;border:1px solid #53657b;border-radius:6px;padding:10px;margin:5px}button{cursor:pointer;background:#256eae}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #344458;text-align:left}.muted{color:#b6c3d2}</style><h1>Finanse floty</h1><p><a href="/firma.html">Moja firma</a> · <a href="/system.html">Centrum operacyjne</a></p><p>Wirtualna ekonomia ETS2. Zakupy opłat nie stanowią rzeczywistych winiet ani polis.</p><section><h2>Leasing</h2><div id="leases"></div><form id="leaseForm"><select name="vehicleId" class="vehicles" required></select><input name="months" type="number" min="12" max="84" value="48" required placeholder="Liczba miesięcy"><input name="apr" type="number" min="0" max="35" step=".01" value="8" required placeholder="Oprocentowanie %"><label>Pierwsza rata <input name="firstDue" type="date" required></label><button>Utwórz harmonogram</button></form></section><section><h2>Ubezpieczenia</h2><div id="policies"></div><form id="policyForm"><select name="vehicleId" class="vehicles" required></select><select name="kind"><option>OC</option><option>AC</option><option>Assistance</option></select><label>Od <input name="start" type="date" required></label><label>Do <input name="end" type="date" required></label><label>Termin składki <input name="due" type="date" required></label><input name="premium" type="number" step=".01" min=".01" placeholder="Składka PLN" required><button>Dodaj polisę</button></form></section><section><h2>Opłaty drogowe</h2><div id="tolls"></div><form id="tollForm"><select name="vehicleId" class="vehicles" required></select><input name="country" placeholder="Kod kraju, np. CZ" maxlength="2" required><select name="kind"><option value="vignette">Winieta czasowa</option><option value="distance">Kilometrowa</option><option value="segment">Odcinkowa</option></select><label>Od <input name="start" type="date" required></label><label>Do <input name="end" type="date" required></label><input name="price" type="number" min=".01" step=".01" placeholder="Kwota PLN" required><button>Opłać</button></form></section><section><h2>Przypomnienia</h2><div id="notices"></div></section><p id="status" role="status"></p><script>
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options){const r=await fetch(url,{credentials:'same-origin',...options});const d=await r.json();if(!r.ok)throw Error(d.error||'Błąd '+r.status);return d}
const render=(id,rows,columns)=>$(id).innerHTML=rows.length?'<table><tr>'+columns.map(x=>'<th>'+esc(x[0])+'</th>').join('')+'</tr>'+rows.map(row=>'<tr>'+columns.map(x=>'<td>'+esc(x[1](row))+'</td>').join('')+'</tr>').join('')+'</table>':'<p class="muted">Brak wpisów</p>';
async function refresh(){const [d,f,t]=await Promise.all([api('/api/fleet-finance/overview'),api('/api/fleet'),api('/api/trailers')]);const vehicles=[...(Array.isArray(f)?f:f.vehicles||f.fleet||[]),...(Array.isArray(t)?t:t.trailers||[])];for(const el of document.querySelectorAll('.vehicles'))el.innerHTML=vehicles.map(v=>'<option value="'+esc(v.id)+'">'+esc(v.model+' · '+v.plate)+'</option>').join('');
render('leases',d.leases,[['Pojazd',x=>x.vehicleId],['Raty',x=>x.schedule.filter(p=>p.status==='paid').length+'/'+x.months],['Oprocentowanie',x=>x.apr+'%'],['Najbliższa rata',x=>x.schedule.find(p=>p.status!=='paid')?.due||'Spłacono']]);
render('policies',d.policies,[['Pojazd',x=>x.vehicleId],['Rodzaj',x=>x.kind],['Do',x=>x.end],['Składka',x=>x.premium+' zł'],['Opłacona',x=>x.paid?'Tak':'Nie']]);
render('tolls',d.tolls,[['Kraj',x=>x.country],['Rodzaj',x=>x.kind],['Do',x=>x.end],['Koszt',x=>x.price+' zł']]);
render('notices',d.notices,[['Termin',x=>x.due],['Powiadomienie',x=>x.label],['Pozostało dni',x=>x.days]]);
}
for(const [id,path] of [['leaseForm','lease'],['policyForm','policy'],['tollForm','toll']])$(id).addEventListener('submit',async e=>{e.preventDefault();const a=Object.fromEntries(new FormData(e.target));for(const key of ['months','apr','premium','price'])if(a[key]!==undefined)a[key]=Number(a[key]);if(a.country)a.country=a.country.toUpperCase();try{await api('/api/fleet-finance/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(a)});$('status').textContent='Zapisano';await refresh()}catch(error){$('status').textContent=error.message}});
refresh().catch(e=>$('status').textContent=e.message);
</script></html>
