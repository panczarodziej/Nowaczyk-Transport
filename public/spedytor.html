<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowaczyk Transport — Spedytor</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#192e45;font:15px Segoe UI,Arial}.layout{display:flex;min-height:100vh}aside{background:#2c333d;color:white;width:235px;padding:28px 17px}aside h2{margin:0 0 35px}aside a{display:block;color:#dce8f6;padding:12px;border-radius:8px;text-decoration:none}aside a:hover{background:#445366}main{flex:1;padding:36px;min-width:0}.panel{background:white;border:1px solid #dce4ee;border-radius:13px;padding:23px;margin:16px 0}.muted{color:#6b8197}.blue{color:#2189eb}button{background:#208ded;color:white;border:0;border-radius:7px;padding:10px 16px;cursor:pointer}input,select{padding:10px;border:1px solid #c7d4e0;border-radius:7px;max-width:100%}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #e5e9f0}label{display:block;margin:8px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}@media(max-width:650px){.layout{display:block}aside{width:100%}main{padding:16px}}</style><div class="layout"><aside><h2>Nowaczyk <span class="blue">Transport</span></h2><a href="/moj-panel.html">Mój panel</a><a data-dispatch href="/spedytor.html">Spedytor</a><a data-admin href="/system.html">Centrum operacyjne</a><a data-admin href="/uzytkownicy.html">Użytkownicy</a><a href="#" onclick="logout();return false">Wyloguj</a></aside><main><h1>Panel spedytora</h1><p>Witaj, <b data-name></b></p><div class="panel"><h2>Trasy firmy</h2><div id="routes">Ładowanie…</div><a href="/centrum-floty.html">Mapa floty →</a> <a href="/trasy.html">Centrum zleceń i tras →</a></div><p id="message"></p></main></div><script>async function loadData(){try{let x=await get('/api/routes');document.getElementById('routes').textContent=`Liczba tras: ${x.length}`}catch(e){document.getElementById('message').textContent=e.message}}</script><script>let me;async function get(url,opts){let r=await fetch(url,opts),d=await r.json();if(!r.ok)throw Error(d.error||'Błąd');return d}async function init(){let x=await get('/api/accounts/me');if(!x.user){location.href='/system-login.html';return}me=x.user;document.querySelectorAll('[data-name]').forEach(e=>e.textContent=me.username);document.querySelectorAll('[data-admin]').forEach(e=>e.hidden=me.role!=='admin');document.querySelectorAll('[data-dispatch]').forEach(e=>e.hidden=!['admin','dispatcher'].includes(me.role));if(typeof loadData==='function')loadData()}async function logout(){await get('/api/logout',{method:'POST'});sessionStorage.removeItem('ksgroup-web-session');location.href='/system-login.html'}init().catch(e=>document.getElementById('message').textContent=e.message)</script></html>
