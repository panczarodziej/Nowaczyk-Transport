name: Instalator Nowaczyk Transport
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['telemetry-v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: telemetry-app
      - run: npm run build:win
        working-directory: telemetry-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Nowaczyk-Transport-Instalator
          path: telemetry-app/dist/Nowaczyk-Transport-Setup-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/telemetry-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nowaczyk-Transport-Instalator
      - name: Opublikuj instalator
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Nowaczyk-Transport-Setup-*.exe --clobber
          else
            gh release create "$tag" Nowaczyk-Transport-Setup-*.exe --verify-tag --title "$tag" --generate-notes
          fi
